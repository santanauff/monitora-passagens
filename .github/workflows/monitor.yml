name: Monitor de passagens

on:
  schedule:
    - cron: "17 11 * * *"   # todo dia 08:17 (Brasília) -> modo diario
    - cron: "43 13 * * 0"   # domingo 10:43 (Brasília)  -> modo varredura
  push:                      # roda 1x quando a config/código muda (modo diario)
    branches: [main]
    paths: ["config.yaml", "monitor.py", ".github/workflows/monitor.yml"]
  workflow_dispatch:
    inputs:
      modo:
        description: "diario ou varredura"
        default: "diario"
        type: choice
        options: [diario, varredura]

permissions:
  contents: write            # para gravar o histórico de volta no repositório

concurrency:
  group: monitor-diario
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Definir modo
        id: modo
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "modo=${{ inputs.modo }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "43 13 * * 0" ]; then
            echo "modo=varredura" >> "$GITHUB_OUTPUT"
          else
            echo "modo=diario" >> "$GITHUB_OUTPUT"
          fi

      - name: Consultar preços
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PAINEL_URL: ${{ vars.PAINEL_URL }}
        run: python monitor.py --modo ${{ steps.modo.outputs.modo }}

      - name: Salvar histórico
        if: always()
        run: |
          git config user.name  "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "dados: ${{ steps.modo.outputs.modo }} $(date -u +%F)"
          git pull --rebase -q origin main && git push
